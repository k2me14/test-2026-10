<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>中1 10月考査</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 科目カードを縦に並べるだけのシンプルな入口 */
:root{
  --bg:#eff1f2; --paper:#ffffff; --ink:#22282d; --sub:#5f6a72; --line:#d6dce0;
  --geo:#1f6f8b; --his:#8b2f4a; --eng:#4338a0;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15191c; --paper:#1e2428; --ink:#e6ebee; --sub:#a0acb4; --line:#323b41; --geo:#5fb3d0; --his:#e58aa3; --eng:#a99cff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15191c; --paper:#1e2428; --ink:#e6ebee; --sub:#a0acb4; --line:#323b41; --geo:#5fb3d0; --his:#e58aa3; --eng:#a99cff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;padding-block:32px 48px}
h1{font-family:var(--display);font-weight:400;font-size:1.8rem;line-height:1.3;margin:0}
h1 small{display:block;font-family:var(--body);font-size:.85rem;font-weight:500;color:var(--sub);letter-spacing:.04em}
.list{display:grid;gap:12px;margin-top:22px}
a.card{display:grid;grid-template-columns:3.2rem 1fr auto;gap:14px;align-items:center;text-decoration:none;color:var(--ink);
  background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:16px 18px}
a.card:hover{border-color:var(--c)}
a.card:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.mark{font-family:var(--display);font-size:1.6rem;color:var(--c);text-align:center;line-height:1}
.card b{display:block;font-size:1.15rem}
.card span{display:block;font-size:.85rem;color:var(--sub);line-height:1.5}
.arrow{color:var(--c);font-weight:700;font-size:1.2rem}
.note{font-size:.82rem;color:var(--sub);margin-top:22px}
</style>

<div class="wrap">
  <h1><small>2026年度 10月考査</small>中1 テスト対策</h1>
  <div class="list">
    <a class="card" href="https://k2me14.github.io/test-2026-10/geography.html" style="--c:var(--geo)">
      <div class="mark">地</div>
      <div><b>地理</b><span>南アジア、西アジア・中央アジア ＋ 7月範囲（中国・朝鮮半島・東南アジア）</span></div>
      <div class="arrow" aria-hidden="true">→</div>
    </a>
    <a class="card" href="https://k2me14.github.io/test-2026-10/history.html" style="--c:var(--his)">
      <div class="mark">歴</div>
      <div><b>歴史</b><span>絶対王政、三大市民革命、産業革命、19世紀の文化 ＋ 7月範囲</span></div>
      <div class="arrow" aria-hidden="true">→</div>
    </a>
    <a class="card" href="https://k2me14.github.io/test-2026-10/english.html" style="--c:var(--eng)">
      <div class="mark">英</div>
      <div><b>英語</b><span>NEW HORIZON Unit 6・7：代名詞、Whose・Which、現在進行形</span></div>
      <div class="arrow" aria-hidden="true">→</div>
    </a>
  </div>
  <p class="note">どの科目も「まとめ」と「問題にチャレンジ」の2つのタブがあります。まちがえた問題やチェックの記録は、この端末に保存されます。</p>
</div>

</body>
</html>
